<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פוקר חברי - מחשבון התחשבנות</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome עבור אייקונים -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- כותרת עליונה -->
    <header class="bg-slate-900 border-b border-slate-800 py-4 px-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-gem"></i> פוקר חברי
            </h1>
            <div class="flex gap-2">
                <button onclick="switchTab('active')" id="nav-active" class="px-3 py-1.5 text-sm rounded-lg bg-amber-500 text-slate-950 font-semibold transition">משחק פעיל</button>
                <button onclick="switchTab('history')" id="nav-history" class="px-3 py-1.5 text-sm rounded-lg bg-slate-800 text-slate-300 font-semibold transition">היסטוריה</button>
            </div>
        </div>
    </header>

    <!-- תוכן ראשי -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-24">
        
        <!-- לשונית משחק פעיל -->
        <section id="tab-active" class="space-y-6">
            <!-- הוספת שחקן -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
                <h2 class="text-sm font-medium text-slate-300 mb-2">הוספת שחקן חדש</h2>
                <form onsubmit="addPlayer(event)" class="flex gap-2">
                    <input type="text" id="playerNameInput" placeholder="שם השחקן..." required
                        class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg transition">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </form>
            </div>

            <!-- רשימת שחקנים -->
            <div class="space-y-3" id="playersListContainer">
                <!-- יתמלא דינמית -->
            </div>

            <!-- כפתור חישוב סוף משחק -->
            <div id="finishGameContainer" class="hidden pt-4">
                <button onclick="openFinishModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-calculator"></i> סיום משחק וחישוב התחשבנות
                </button>
            </div>
        </section>

        <!-- לשונית היסטוריה -->
        <section id="tab-history" class="hidden space-y-4">
            <h2 class="text-lg font-bold text-amber-400">היסטוריית שולחנות וסטטיסטיקות</h2>
            <div id="historyContainer" class="space-y-3">
                <!-- יתמלא דינמית -->
            </div>
        </section>

    </main>

    <!-- מודל הזנת צ'יפים בסוף משחק -->
    <div id="finishModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-coins"></i> ספירת צ'יפים סופית (Cash Out)
            </h3>
            <p class="text-xs text-slate-400">הקש עבור כל שחקן את כמות הצ'יפים המדויקת שנשארה לו ביד בסוף הערב:</p>
            
            <div id="cashOutList" class="space-y-3">
                <!-- יתמלא דינמית -->
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="closeFinishModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl font-medium transition">ביטול</button>
                <button onclick="calculateAndFinish()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-2.5 rounded-xl font-bold transition">חשב והצג תוצאות</button>
            </div>
        </div>
    </div>

    <!-- מודל תוצאות וסיכום -->
    <div id="resultsModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-5 space-y-5 max-h-[95vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-xl font-bold text-amber-400"><i class="fa-solid fa-receipt"></i> סיכום ערב הפוקר</h3>
                <button onclick="closeResultsModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <!-- תוכן הסיכום -->
            <div id="resultsContent" class="space-y-4 text-sm">
                <!-- יתמלא דינמית -->
            </div>

            <!-- פעולות -->
            <div class="space-y-2 pt-2">
                <button onclick="copyToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i> העתק סיכום לוואטסאפ
                </button>
                <button onclick="startNewTable()" class="w-full bg-slate-800 hover:bg-red-950/50 hover:border-red-900 border border-transparent text-slate-300 hover:text-red-400 py-2.5 rounded-xl font-medium transition text-xs">
                    <i class="fa-solid fa-arrow-rotate-right"></i> סגור שולחן והתחל ערב חדש
                </button>
            </div>
        </div>
    </div>

    <!-- סקריפט הניהול והלוגיקה -->
    <script>
        // מבנה נתונים ראשי
        let gameState = JSON.parse(localStorage.getItem('poker_gamestate')) || {
            players: [],
            isFinished: false,
            results: null
        };

        let historyList = JSON.parse(localStorage.getItem('poker_history')) || [];

        // קבועים
        const CHIPS_PER_BUYIN = 200;
        const PRICE_PER_BUYIN = 50;

        function saveState() {
            localStorage.setItem('poker_gamestate', JSON.stringify(gameState));
            localStorage.setItem('poker_history', JSON.stringify(historyList));
        }

        // ניווט בין לשוניות
        function switchTab(tab) {
            document.getElementById('tab-active').classList.toggle('hidden', tab !== 'active');
            document.getElementById('tab-history').classList.toggle('hidden', tab !== 'history');
            
            document.getElementById('nav-active').className = tab === 'active' 
                ? 'px-3 py-1.5 text-sm rounded-lg bg-amber-500 text-slate-950 font-semibold transition'
                : 'px-3 py-1.5 text-sm rounded-lg bg-slate-800 text-slate-300 font-semibold transition';
            
            document.getElementById('nav-history').className = tab === 'history' 
                ? 'px-3 py-1.5 text-sm rounded-lg bg-amber-500 text-slate-950 font-semibold transition'
                : 'px-3 py-1.5 text-sm rounded-lg bg-slate-800 text-slate-300 font-semibold transition';

            if (tab === 'history') renderHistory();
        }

        // הוספת שחקן
        function addPlayer(e) {
            e.preventDefault();
            const input = document.getElementById('playerNameInput');
            const name = input.value.trim();
            if(!name) return;

            if(gameState.players.some(p => p.name === name)) {
                alert('שחקן בשם זהה כבר קיים בשולחן!');
                return;
            }

            gameState.players.push({
                name: name,
                buyins: 1,
                chips: 0
            });

            input.value = '';
            saveState();
            renderActiveGame();
        }

        // שינוי כניסות
        function updateBuyins(index, delta) {
            gameState.players[index].buyins += delta;
            if(gameState.players[index].buyins < 0) gameState.players[index].buyins = 0;
            saveState();
            renderActiveGame();
        }

        // הצגת המשחק הפעיל
        function renderActiveGame() {
            const container = document.getElementById('playersListContainer');
            const finishContainer = document.getElementById('finishGameContainer');
            
            if(gameState.players.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-slate-800/50 rounded-xl border border-slate-800 text-slate-400">
                        <i class="fa-solid fa-users text-3xl mb-2 text-slate-600"></i>
                        <p>אין שחקנים בשולחן עדיין.<br>הוסף שחקנים כדי להתחיל.</p>
                    </div>`;
                finishContainer.classList.add('hidden');
                return;
            }

            finishContainer.classList.remove('hidden');

            container.innerHTML = gameState.players.map((p, idx) => `
                <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700/80 flex items-center justify-between shadow-sm">
                    <div>
                        <span class="font-bold text-white text-base">${p.name}</span>
                        <div class="text-xs text-slate-400 mt-0.5">עלות עד כה: <span class="text-amber-400 font-medium">${p.buyins * PRICE_PER_BUYIN} ₪</span> (${p.buyins} כניסות)</div>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                        <button onclick="updateBuyins(${idx}, -1)" class="w-7 h-7 flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md transition font-bold">-</button>
                        <span class="w-5 text-center font-bold text-amber-400 text-sm">${p.buyins}</span>
                        <button onclick="updateBuyins(${idx}, 1)" class="w-7 h-7 flex items-center justify-center bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-md transition font-bold">+</button>
                    </div>
                </div>
            `).join('');
        }

        // פתיחת מודל סיום משחק
        function openFinishModal() {
            if(gameState.players.length === 0) return;
            const container = document.getElementById('cashOutList');
            container.innerHTML = gameState.players.map((p, idx) => `
                <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex items-center justify-between">
                    <div>
                        <span class="font-bold text-white">${p.name}</span>
                        <div class="text-xs text-slate-400">קנה ${p.buyins} כניסות (${p.buyins * CHIPS_PER_BUYIN} צ'יפים)</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="number" id="chips_input_${idx}" value="${p.chips || 0}" min="0" placeholder="צ'יפים"
                            class="w-24 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white text-center font-bold focus:outline-none focus:border-amber-500">
                        <span class="text-xs text-slate-400">צ'יפים</span>
                    </div>
                </div>
            `).join('');
            document.getElementById('finishModal').classList.remove('hidden');
        }

        function closeFinishModal() {
            document.getElementById('finishModal').classList.add('hidden');
        }

        // חישוב והצגת תוצאות
        function calculateAndFinish() {
            gameState.players.forEach((p, idx) => {
                const val = parseInt(document.getElementById(`chips_input_${idx}`).value);
                p.chips = isNaN(val) ? 0 : val;
            });

            let totalInvestedChips = 0;
            let totalFinalChips = 0;

            const calculatedPlayers = gameState.players.map(p => {
                const investedMoney = p.buyins * PRICE_PER_BUYIN;
                const investedChips = p.buyins * CHIPS_PER_BUYIN;
                totalInvestedChips += investedChips;
                totalFinalChips += p.chips;

                const cashOutMoney = Math.round(p.chips * (PRICE_PER_BUYIN / CHIPS_PER_BUYIN));
                const netProfit = cashOutMoney - investedMoney;

                return {
                    name: p.name,
                    buyins: p.buyins,
                    investedMoney: investedMoney,
                    chips: p.chips,
                    cashOutMoney: cashOutMoney,
                    netProfit: netProfit
                };
            });

            let debtors = calculatedPlayers.map(p => ({ name: p.name, balance: p.netProfit })).filter(p => p.balance < 0);
            let creditors = calculatedPlayers.map(p => ({ name: p.name, balance: p.netProfit })).filter(p => p.balance > 0);

            debtors.sort((a, b) => a.balance - b.balance);
            creditors.sort((a, b) => b.balance - a.balance);

            let transactions = [];
            let d = 0, c = 0;

            while (d < debtors.length && c < creditors.length) {
                let debtAmount = Math.abs(debtors[d].balance);
                let creditAmount = creditors[c].balance;
                let transferAmount = Math.min(debtAmount, creditAmount);

                if (transferAmount > 0) {
                    transactions.push({
                        from: debtors[d].name,
                        to: creditors[c].name,
                        amount: transferAmount
                    });
                }

                debtors[d].balance += transferAmount;
                creditors[c].balance -= transferAmount;

                if (Math.abs(debtors[d].balance) < 1) d++;
                if (creditors[c].balance < 1) c++;
            }

            gameState.isFinished = true;
            gameState.results = {
                date: new Date().toLocaleDateString('he-IL'),
                players: calculatedPlayers,
                transactions: transactions,
                discrepancy: totalInvestedChips - totalFinalChips
            };

            saveState();
            closeFinishModal();
            showResultsModal();
        }

        // הצגת מודל התוצאות
        function showResultsModal() {
            const res = gameState.results;
            const container = document.getElementById('resultsContent');

            let discrepancyHtml = '';
            if(res.discrepancy !== 0) {
                discrepancyHtml = `<div class="bg-amber-950/40 border border-amber-800 text-amber-300 p-2.5 rounded-lg text-xs mb-3">
                    <i class="fa-solid fa-triangle-exclamation"></i> שים לב: יש הפרש של ${Math.abs(res.discrepancy)} צ'יפים בספירה הכוללת (${res.discrepancy > 0 ? 'חסרים צ'יפים' : 'יותר מדי צ'יפים'}).
                </div>`;
            }

            container.innerHTML = `
                ${discrepancyHtml}
                <div>
                    <h4 class="font-bold text-slate-300 mb-2 text-xs uppercase tracking-wider">מאזן שחקנים</h4>
                    <div class="space-y-1.5">
                        ${res.players.map(p => `
                            <div class="bg-slate-800 p-2.5 rounded-lg flex justify-between items-center">
                                <span class="font-bold text-white">${p.name}</span>
                                <div class="text-left">
                                    <span class="font-bold ${p.netProfit > 0 ? 'text-emerald-400' : p.netProfit < 0 ? 'text-red-400' : 'text-slate-400'}">
                                        ${p.netProfit > 0 ? '+' : ''}${p.netProfit} ₪
                                    </span>
                                    <div class="text-[10px] text-slate-400">השקיע ${p.investedMoney} ₪ | נשאר עם ${p.chips} צ'יפים</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="pt-2">
                    <h4 class="font-bold text-slate-300 mb-2 text-xs uppercase tracking-wider">התחשבנות סופית (מי משלם למי)</h4>
                    <div class="space-y-1.5">
                        ${res.transactions.length === 0 ? '<p class="text-slate-400 text-xs">הכל מאוזן! אין העברות כספים נדרשות.</p>' : 
                            res.transactions.map(t => `
                                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex justify-between items-center text-xs">
                                    <span class="font-bold text-white">${t.from}</span>
                                    <span class="text-amber-400 font-bold bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20">מעביר ${t.amount} ₪</span>
                                    <span class="font-bold text-emerald-400">${t.to}</span>
                                </div>
                            `).join('')}
                    </div>
                </div>
            `;

            document.getElementById('resultsModal').classList.remove('hidden');
        }

        function closeResultsModal() {
            document.getElementById('resultsModal').classList.add('hidden');
        }

        // העתקה לוואטסאפ
        function copyToWhatsApp() {
            const res = gameState.results;
            if(!res) return;

            let text = `♠️ *סיכום ערב פוקר (${res.date})* ♣️\n\n`;
            text += `👥 *מאזן שחקנים:*\n`;
            res.players.forEach(p => {
                text += `• ${p.name}: ${p.netProfit > 0 ? '+' : ''}${p.netProfit} ₪ (השקיע ${p.investedMoney}₪)\n`;
            });

            text += `\n💸 *התחשבנות סופית:*\n`;
            if(res.transactions.length === 0) {
                text += `הכל מאוזן!\n`;
            } else {
                res.transactions.forEach(t => {
                    text += `• *${t.from}* ➡️ מעביר *${t.amount} ₪* אל *${t.to}*\n`;
                });
            }

            navigator.clipboard.writeText(text).then(() => {
                alert('הסיכום הועתק ללוח בהצלחה! הדבק בקבוצת הוואטסאפ.');
            });
        }

        // סגירת שולחן והתחלת חדש
        function startNewTable() {
            if(!confirm('האם אתה בטוח שברצונך לאפס את השולחן הנוכחי? המשחק יועבר להיסטוריה.')) return;

            if(gameState.isFinished && gameState.results) {
                historyList.unshift(gameState.results);
            }

            gameState = {
                players: [],
                isFinished: false,
                results: null
            };

            saveState();
            closeResultsModal();
            renderActiveGame();
        }

        // הצגת היסטוריה
        function renderHistory() {
            const container = document.getElementById('historyContainer');
            if(historyList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 bg-slate-800/50 rounded-xl border border-slate-800 text-slate-400">
                        <i class="fa-solid fa-clock-rotate-left text-3xl mb-2 text-slate-600"></i>
                        <p>אין משחקים שמורים בהיסטוריה עדיין.</p>
                    </div>`;
                return;
            }

            container.innerHTML = historyList.map((game, hIdx) => `
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                        <span class="font-bold text-amber-400"><i class="fa-regular fa-calendar"></i> משחק מתאריך ${game.date}</span>
                        <button onclick="deleteHistoryItem(${hIdx})" class="text-slate-500 hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="text-xs space-y-1 text-slate-300">
                        ${game.players.map(p => `
                            <div class="flex justify-between">
                                <span>${p.name}</span>
                                <span class="${p.netProfit > 0 ? 'text-emerald-400' : p.netProfit < 0 ? 'text-red-400' : 'text-slate-400'} font-bold">
                                    ${p.netProfit > 0 ? '+' : ''}${p.netProfit} ₪
                                </span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function deleteHistoryItem(hIdx) {
            if(!confirm('למחוק את המשחק מההיסטוריה?')) return;
            historyList.splice(hIdx, 1);
            saveState();
            renderHistory();
        }

        window.onload = function() {
            renderActiveGame();
            if(gameState.isFinished && gameState.results) {
                showResultsModal();
            }
        };
    </script>
</body>
</html>
